[package]
name = "mini-nix"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
itertools = "0.14.0"
once_cell = "1.21.3"
thiserror = "2.0.18"
tracing = "0.1.44"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
members = [
  "cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mini-nix = { path = ".", version = "0.1.0" }
tracing = "0.1.44"
